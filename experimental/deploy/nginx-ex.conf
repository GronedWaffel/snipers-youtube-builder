# Only pinned verified app packages are placed in this separate directory.
location ^~ /builder/ex/youtube-packages/ {
    alias /opt/snipers-youtube-ex/packages/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff;
}
# Add inside the existing sniperscheats.lol server after local candidate checks.
# Exact matching prevents /builder/ex from falling through to the stable builder.
# The slash keeps every browser request within the experimental service.
location = /builder/ex { return 302 /builder/ex/; }
location ^~ /builder/ex/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
    add_header Cache-Control "no-store" always;
}
