# Only pinned verified app packages are placed in this separate directory.
location = /build { return 302 /builder/; }
location = /build/ { return 302 /builder/; }
location ^~ /diagnostics/ {
    if ($scheme = http) { return 308 https://sniperscheats.lol$request_uri; }
    proxy_pass http://127.0.0.1:8790/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
    proxy_read_timeout 70s;
    add_header Cache-Control "no-store" always;
}
location = /payloads/ex { return 302 /payloads/ex/; }
location ^~ /payloads/ex/ {
    alias /opt/snipers-youtube-ex/current/experimental/payload-hub/;
    index index.html;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff;
}
location ^~ /builder/ex/youtube-packages/ {
    alias /opt/snipers-youtube-ex/packages/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff;
}
# Add inside the existing sniperscheats.lol server after local candidate checks.
# Exact matching prevents /builder/ex from falling through to the stable builder.
# The slash keeps every browser request within the experimental service.
location = /builder/ex { return 302 /builder/ex/; }
location ^~ /builder/ex/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;
    add_header Cache-Control "no-store" always;
}
