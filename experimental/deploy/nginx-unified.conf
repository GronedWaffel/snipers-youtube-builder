# Unified service; legacy jobs remain readable while their sessions drain.
recursive_error_pages on;
location = /build { return 302 /builder/; }
location = /build/ { return 302 /builder/; }
location = /builder { return 302 /builder/; }
location = /builder/ex { return 302 /builder/$is_args$args; }
location = /builder/ex/ { return 302 /builder/$is_args$args; }
location = /builder/ex/index.html { return 302 /builder/$is_args$args; }
location = /builder/ex/install { return 302 /builder/install$is_args$args; }
location = /builder/ex/install.html { return 302 /builder/install$is_args$args; }
location ^~ /builder/youtube-packages/ { alias /opt/snipers-youtube-ex/packages/; types {} default_type application/octet-stream; gzip off; }
location ^~ /builder/ex/youtube-packages/ { alias /opt/snipers-youtube-ex/packages/; types {} default_type application/octet-stream; gzip off; }
location ^~ /builder/ex/ {
rewrite ^/builder/ex/(.*)$ /$1 break;
proxy_pass http://127.0.0.1:8792;
proxy_intercept_errors on; error_page 404 = @unified_legacy_stable;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 64m;
proxy_buffering off;
add_header Cache-Control "no-store" always;
}
location ^~ /builder/ {
rewrite ^/builder/(.*)$ /$1 break;
proxy_pass http://127.0.0.1:8792;
proxy_intercept_errors on; error_page 404 = @unified_legacy_stable;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 64m;
proxy_buffering off;
add_header Cache-Control "no-store" always;
}
location @unified_legacy_stable { proxy_pass http://127.0.0.1:8788; proxy_intercept_errors on; error_page 404 = @unified_legacy_ex;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 64m;
proxy_buffering off;
add_header Cache-Control "no-store" always;
}
location @unified_legacy_ex { proxy_pass http://127.0.0.1:8789;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 64m;
proxy_buffering off;
add_header Cache-Control "no-store" always;
}
location ^~ /diagnostics/ {
 if ($scheme = http) { return 308 https://$host$request_uri; }
 proxy_pass http://127.0.0.1:8790/;
 proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
 client_max_body_size 12m; proxy_read_timeout 60s;
 add_header Cache-Control "no-store" always;
}
location = /payloads { return 302 /payloads/; }
location = /payloads/ex { return 302 /payloads/; }
location = /payloads/ex/ { return 302 /payloads/; }
location = /payloads/ex/index.html { return 302 /payloads/; }
location ^~ /payloads/ex/ {
 alias /opt/snipers-youtube-ex/current/experimental/payload-hub/;
 add_header Cache-Control "no-store" always;
}
location ^~ /payloads/ {
 alias /opt/snipers-youtube-unified/current/experimental/payload-hub/;
 index index.html; error_page 404 = @unified_legacy_payload;
 add_header Cache-Control "no-store" always;
}
location @unified_legacy_payload {
 root /var/www/sniperscheats/current;
 try_files $uri =404;
}
